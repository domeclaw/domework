name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test mode - builds but does not create GitHub release'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '24.15.0'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Node.js binaries
        run: pnpm -F @domework/desktop download:nodejs

      - name: Build desktop app
        run: pnpm -F @domework/daemon build && pnpm -F @domework/desktop build

      - name: Stage daemon deps
        run: pnpm -F @domework/desktop stage:daemon-deps

      - name: Package (unsigned)
        run: node scripts/package.cjs --mac --arm64 --publish never
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON: python
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Domework-macOS-arm64
          path: |
            apps/desktop/release/*-arm64.dmg
            apps/desktop/release/*-arm64.zip
          retention-days: 30

  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Node.js binaries
        run: pnpm -F @domework/desktop download:nodejs --platform=win32-x64

      - name: Build desktop app
        run: pnpm -F @domework/daemon build && pnpm -F @domework/desktop build

      - name: Stage daemon deps
        run: pnpm -F @domework/desktop stage:daemon-deps

      - name: Package (unsigned)
        run: node scripts/package.cjs --win --x64 --publish never
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Domework-Windows-x64
          path: apps/desktop/release/*.exe
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-mac-arm64, build-windows-x64]
    if: always() && needs.build-mac-arm64.result == 'success' && needs.build-windows-x64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine if dry run
        id: check
        run: echo "dry_run=${{ inputs.dry_run || 'false' }}" >> $GITHUB_OUTPUT

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: Domework-macOS-arm64
          path: ./release/arm64

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: Domework-Windows-x64
          path: ./release/win-x64

      - name: List release artifacts
        run: find ./release -type f 2>/dev/null || echo "No artifacts found"

      - name: Create Release
        if: steps.check.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Domework ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./release/arm64/*
            ./release/win-x64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
